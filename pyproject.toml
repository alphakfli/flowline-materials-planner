[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowline-materials-planner"
version = "0.10.0"
description = "Open-source materials planner for engineer-to-order manufacturing: clear-to-build, inventory turns and year-end working capital, contract manufacturers and supplier scorecards."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Alpha Li" }]
keywords = ["materials management", "supply chain", "clear to build", "inventory turns", "working capital", "supplier scorecard", "engineer to order"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Manufacturing",
  "Topic :: Office/Business",
]
dependencies = [
  "pandas>=2.1,<4",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "reportlab>=4.0",
  "plotly>=5.18",
  "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
flowline = "flowline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/streamlit_app.py" = ["E402"]   # imports follow the sys.path setup for Streamlit Community Cloud
